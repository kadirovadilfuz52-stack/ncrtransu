<!DOCTYPE html>
<html lang="uz">
<head><meta charset="UTF-8"><title>Yuk qo'shish</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h3 class="mb-3">Yangi Yuk Qo'shish</h3>
            <form method="POST">
                <input type="text" name="title" class="form-control mb-2" placeholder="Yuk nomi" required>
                <input type="text" name="from_city" class="form-control mb-2" placeholder="Qayerdan (Shahar)" required>
                <input type="text" name="to_city" class="form-control mb-2" placeholder="Qayerga (Shahar)" required>
                <input type="number" step="0.1" name="weight" class="form-control mb-2" placeholder="Og'irligi (tonna)" required>
                <input type="text" name="price" class="form-control mb-2" placeholder="Narxi" required>
                <input type="text" name="cargo_type" class="form-control mb-3" placeholder="Yuk turi" required>
                <button type="submit" class="btn btn-primary w-100">Qo'shish</button>
            </form>
        </div>
    </div>
</body>
</html>
