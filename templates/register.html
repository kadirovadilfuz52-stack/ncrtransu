<!DOCTYPE html>
<html lang="uz">
<head><meta charset="UTF-8"><title>Ro'yxatdan o'tish</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-3">Ro'yxatdan o'tish</h3>
        <form method="POST">
            <input type="text" name="name" class="form-control mb-2" placeholder="Ism" required>
            <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
            <input type="text" name="phone" class="form-control mb-2" placeholder="Telefon raqam (Masalan: 901234567)" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Parol" required>
            <select name="role" class="form-control mb-3">
                <option value="owner">Yuk egasi</option>
                <option value="driver">Haydovchi</option>
                <option value="dispatcher">Dispetcher</option>
            </select>
            <button type="submit" class="btn btn-success w-100">Jo'natish</button>
        </form>
    </div>
</body>
</html>
